name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Verify TypeScript, tests, manifests and renderer build
        run: npm run verify

      - name: Restore telemetry service
        run: dotnet restore ApexHUD.sln

      - name: Build telemetry service
        run: dotnet build ApexHUD.sln --configuration Release --no-restore
