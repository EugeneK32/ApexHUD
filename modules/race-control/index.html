<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Race Control</title>
  </head>
  <body>
    <main id="control">
      <i id="lamp" class="accent-rail"></i>
      <header><span>RACE CONTROL</span><b id="incident-chip">0x</b></header>
      <section>
        <div class="flag-mark"><i></i></div>
        <div class="copy"><strong id="message">CLEAR</strong><span id="detail">GREEN</span></div>
      </section>
      <footer id="instruction">TRACK CLEAR</footer>
    </main>
    <script src="module.js"></script>
  </body>
</html>
