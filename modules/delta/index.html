<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';" />
  <link rel="stylesheet" href="style.css" />
  <title>Configurable Delta</title>
</head>
<body>
<main id="delta" class="module-root delta">
 <div data-protocol-error></div>
 <header><span id="reference-label">SESSION BEST</span><span id="validity" class="validity">VALID</span></header>
 <section class="delta-main"><span id="delta-value">—</span><span id="delta-unit">SEC</span></section>
 <div id="meter" class="meter"><i class="center"></i><i id="marker" class="marker"></i></div>
 <footer id="times"><div><span>CURRENT</span><strong id="current">—</strong></div><div><span>LAST</span><strong id="last">—</strong></div><div><span>BEST</span><strong id="best">—</strong></div></footer>
</main>
<script src="runtime.js"></script>
<script src="module.js"></script>
</body>
</html>
