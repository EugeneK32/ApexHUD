<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Delta</title>
  </head>
  <body>
    <main id="delta">
      <i class="accent-rail"></i>
      <header><span>DELTA</span><div class="status"><i class="validity" id="validity"></i><b id="validity-label">NO DATA</b></div></header>
      <section class="delta-main">
        <div class="copy"><span class="label">TO BEST CLEAN</span><strong id="value">--.---</strong></div>
        <div class="meter" aria-hidden="true"><span class="loss-mark">+1.0</span><i id="meter-marker"></i><em></em><span class="gain-mark">−1.0</span></div>
      </section>
      <footer class="times" id="times"><span>CURRENT <b id="current">—</b></span><span>BEST <b id="best">—</b></span></footer>
    </main>
    <script src="module.js"></script>
  </body>
</html>
